services:
  backend:
    image: ghcr.io/holo-otaku/dst-backend:release
    restart: unless-stopped
    volumes:
      - ./images:/usr/app/img
      - ./logs:/usr/app/logs
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - dst_network
    env_file:
      - .env

  web:
    image: ghcr.io/holo-otaku/dst-frontend:release
    restart: unless-stopped
    networks:
      - dst_network
    ports:
      - 80:80
      - 443:443
    volumes:
      # 覆蓋原本的 nginx 設定
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf

  postgres:
    image: postgres:18.6-alpine
    restart: unless-stopped
    networks:
      - dst_network
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - TZ=Asia/Taipei
    volumes:
      # 18 起資料放在 /var/lib/postgresql/<major>/，掛上層目錄
      - pg_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      retries: 20

  # MySQL 與 phpMyAdmin 只在搬到 PostgreSQL 的過渡期保留，
  # 確認 PostgreSQL 正常後依 docs/upgrade-to-postgres.md 的「清理」移除
  database:
    image: mysql:8.4
    restart: unless-stopped
    networks:
      - dst_network
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - TZ=Asia/Taipei
    volumes:
      - mysql_data:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin:latest
    restart: unless-stopped
    depends_on:
      - database
    networks:
      - dst_network
    ports:
      - 127.0.0.1:5278:80
    environment:
      PMA_HOST: database
      PMA_PORT: 3306

volumes:
  pg_data:
  mysql_data:

networks:
  dst_network:
